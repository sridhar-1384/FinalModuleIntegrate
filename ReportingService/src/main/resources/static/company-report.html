<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Company Report</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/admin-dashboard.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">Placement Management System</span>
    <button class="btn btn-outline-light btn-sm" id="login">
        Login
    </button>
    <script>
        const sec = document.getElementById('login');
        let token = sessionStorage.getItem('sessionToken');
        sec.innerHTML = token ? 'Logout' : 'Login';
        sec.addEventListener("click",()=>{
            if(token) sessionStorage.clear();
            window.location.href = "/TeamA/login.html";
        });
    </script>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>

            <a href="po-dashboard.html">
                <i class="bi bi-grid me-2"></i>Dashboard
            </a>

            <a href="placement-report.html">
                <i class="bi bi-clipboard-data me-2"></i>Placement Report
            </a>

            <a href="department-report.html">
                <i class="bi bi-diagram-3 me-2"></i>Department Report
            </a>

            <a href="student-stats.html">
                <i class="bi bi-bar-chart me-2"></i>Student Statistics
            </a>

            <a class="active" href="#">
                <i class="bi bi-building me-2"></i>Company Report
            </a>

            <a href="student-list.html">
                <i class="bi bi-people me-2"></i>Students
            </a>
        </div>

        <!-- Main -->
        <div class="col-md-10 p-4">
            <div class="report-title-box">
                <h4 class="fw-semibold mb-0">Company-wise Report</h4>
            </div>

            <div class="glass-card p-4">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>
                            Company
                            <i class="bi bi-arrow-down-up ms-1 sort-icon" onclick="sortBy('companyName')"></i>
                        </th>
                        <th>
                            Jobs Posted
                            <i class="bi bi-arrow-down-up ms-1 sort-icon" onclick="sortBy('jobsPosted')"></i>
                        </th>
                        <th>
                            Students Hired
                            <i class="bi bi-arrow-down-up ms-1 sort-icon" onclick="sortBy('studentsHired')"></i>
                        </th>
                        <th>
                            Avg Package (LPA)
                            <i class="bi bi-arrow-down-up ms-1 sort-icon" onclick="sortBy('avgPackage')"></i>
                        </th>
                    </tr>
                    </thead>

                    <tbody id="reportTableBody">
                    </tbody>
                </table>

                <button class="btn export-btn" onclick="exportPdf()">
                    <i class="bi bi-file-earmark-pdf me-1"></i> Export as PDF
                </button>
            </div>
        </div>
    </div>
</div>

<script>

    let companyData = [];

    const sortState = {
        companyName: true,
        jobsPosted: true,
        studentsHired: true,
        avgPackage: true
    };

    function renderTable() {
        const tbody = document.getElementById("reportTableBody");
        tbody.innerHTML = "";

        companyData.forEach(item => {
            const row = `
                <tr>
                    <td>${item.companyName}</td>
                    <td>${item.jobsPosted}</td>
                    <td>${item.studentsHired}</td>
                    <td>${item.avgPackage.toFixed(2)}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function sortBy(field) {
        const ascending = sortState[field];

        companyData.sort((a, b) => {
            let valA = a[field];
            let valB = b[field];

            if (typeof valA === "string") {
                return ascending ? valA.localeCompare(valB) : valB.localeCompare(valA);
            }
            return ascending ? valA - valB : valB - valA;
        });

        sortState[field] = !ascending;
        renderTable();
    }

    function loadCompanyReport() {
        const token = sessionStorage.getItem("sessionToken");
        if (!token) {
            alert("Session expired. Please login again.");
            window.location.href = "/TeamA/login.html";
            return;
        }

        fetch("http://localhost:8085/api/reports/company-wise", {
            headers: {
                "X-SESSION-TOKEN": token
            }
        })
            .then(res => {
                if (!res.ok) throw new Error("Failed to load company report");
                return res.json();
            })
            .then(data => {
                companyData = data;
                companyData.sort((a, b) => a.companyName.localeCompare(b.companyName));
                renderTable();
            })
            .catch(err => {
                console.error("Error loading company report:", err);
            });
    }

    function exportPdf() {
        const token = sessionStorage.getItem("sessionToken");
        if (!token) {
            alert("Session expired. Please login again.");
            window.location.href = "/TeamA/login.html";
            return;
        }

        fetch("http://localhost:8085/api/reports/export", {
            headers: {
                "X-SESSION-TOKEN": token
            }
        })
            .then(res => {
                if (!res.ok) throw new Error("Failed to export PDF");
                return res.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                window.open(url, "_blank");
            })
            .catch(err => {
                console.error("Failed to export PDF:", err);
            });
    }

    loadCompanyReport();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
