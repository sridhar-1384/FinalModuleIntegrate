<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Placement Report</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/admin-dashboard.css">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">Placement Management System</span>
    <button class="btn btn-outline-light btn-sm" id="login">Login</button>
    <script>
        const sec = document.getElementById('login');
        let token = sessionStorage.getItem('sessionToken');
        token ? (sec.innerHTML = 'Logout') : (sec.innerHTML = 'Login');
        sec.addEventListener("click",()=>{
            if(token) sessionStorage.clear();
            window.location.href="/login.html";
        });
    </script>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>

            <a href="po-dashboard.html">
                <i class="bi bi-grid me-2"></i>Dashboard
            </a>

            <a class="active" href="#">
                <i class="bi bi-bar-chart-line me-2"></i>Placement Report
            </a>

            <a href="department-report.html">
                <i class="bi bi-diagram-3 me-2"></i>Department Report
            </a>

            <a href="student-stats.html">
                <i class="bi bi-people me-2"></i>Student Statistics
            </a>

            <a href="company-report.html">
                <i class="bi bi-bar-chart me-2"></i>Company Report
            </a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <div class="report-title-box">
                <h4 class="fw-semibold mb-0">Placement Report</h4>
            </div>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">

                <div class="col-md-4">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-people fs-2 text-primary"></i>
                        <h6 class="mt-2 text-muted">Total Students</h6>
                        <h2 class="fw-bold" id="totalStudents">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-check-circle fs-2 text-success"></i>
                        <h6 class="mt-2 text-muted">Placed Students</h6>
                        <h2 class="fw-bold" id="placedStudents">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-percent fs-2 text-warning"></i>
                        <h6 class="mt-2 text-muted">Placement %</h6>
                        <h2 class="fw-bold" id="placementPercentage">0%</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-currency-rupee fs-2 text-primary"></i>
                        <h6 class="mt-2 text-muted">Average Package (LPA)</h6>
                        <h2 class="fw-bold" id="averagePackage">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-trophy fs-2 text-success"></i>
                        <h6 class="mt-2 text-muted">Highest Package (LPA)</h6>
                        <h2 class="fw-bold" id="highestPackage">0</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-building fs-2 text-secondary"></i>
                        <h6 class="mt-2 text-muted">Companies Visited</h6>
                        <h2 class="fw-bold" id="companiesVisited">0</h2>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<script>
    function loadPlacementReport() {

        fetch("http://localhost:8085/api/reports/overview")

<!--        const token = sessionStorage.getItem("sessionToken");-->
<!--        if (!token) return;-->

<!--        fetch("http://localhost:8085/api/reports/overview", {-->
<!--            headers: {-->
<!--                "X-SESSION-TOKEN": token-->
<!--            }-->
<!--        })-->
        .then(res => res.json())
        .then(data => {
            document.getElementById("totalStudents").innerText = data.totalStudents;
            document.getElementById("placedStudents").innerText = data.placedStudents;
            document.getElementById("placementPercentage").innerText =
                data.placedPercentage.toFixed(2) + "%";
            document.getElementById("averagePackage").innerText =
                data.averagePackage?.toFixed(2) ?? 0;
            document.getElementById("highestPackage").innerText =
                data.highestPackage?.toFixed(2) ?? 0;
            document.getElementById("companiesVisited").innerText =
                data.companiesVisited;
        })
        .catch(err => {
            console.error("Error loading placement report", err);
        });
    }

    loadPlacementReport();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
