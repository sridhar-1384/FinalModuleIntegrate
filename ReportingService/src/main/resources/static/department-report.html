<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Department-wise Report</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/admin-dashboard.css">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">Placement Management System</span>
    <button class="btn btn-outline-light btn-sm" id="login">Login</button>
    <script>
        const sec = document.getElementById('login');
        let token = sessionStorage.getItem('sessionToken');
        token ? (sec.innerHTML = 'Logout') : (sec.innerHTML = 'Login');
        sec.addEventListener("click",()=>{
            if(token) sessionStorage.clear();
            window.location.href="/login.html";
        });
    </script>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>

            <a href="po-dashboard.html">
                <i class="bi bi-grid me-2"></i>Dashboard
            </a>

            <a href="placement-report.html">
                <i class="bi bi-clipboard-data me-2"></i>Placement Report
            </a>

            <a class="active" href="#">
                <i class="bi bi-diagram-3 me-2"></i>Department Report
            </a>

            <a href="student-stats.html">
                <i class="bi bi-bar-chart me-2"></i>Student Statistics
            </a>

            <a href="company-report.html">
                <i class="bi bi-building me-2"></i>Company Report
            </a>

            <a href="student-list.html">
                <i class="bi bi-people me-2"></i>Students
            </a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <div class="report-title-box">
                <h4 class="fw-semibold mb-0">Department-wise Report</h4>
            </div>

            <div class="glass-card p-4">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Department</th>
                        <th>Total Students</th>
                        <th>Placed Students</th>
                        <th>Avg Package (LPA)</th>
                    </tr>
                    </thead>
                    <tbody id="deptReportBody">
                    <!-- Rows inserted here -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
    function loadDepartmentReport() {

        fetch("http://localhost:8085/api/reports/department-wise")
//
// <!--        const token = sessionStorage.getItem("sessionToken");-->
// <!--        if (!token) return;-->
//
// <!--        fetch("http://localhost:8085/api/reports/department-wise", {-->
// <!--            headers: {-->
// <!--                "X-SESSION-TOKEN": token-->
// <!--            }-->
// <!--        })-->
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById("deptReportBody");
            tbody.innerHTML = "";

            data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.department}</td>
                        <td>${item.totalStudents}</td>
                        <td>${item.placedStudents}</td>
                        <td>${item.averagePackage !== null
                            ? item.averagePackage.toFixed(2)
                            : "-"}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        })
        .catch(err => {
            console.error("Error loading department report", err);
        });
    }

    loadDepartmentReport();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
