<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mthree Placement | Company Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"
    />

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }

        /* Sidebar */
        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }

        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }

        /* Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <div class="d-flex align-items-center gap-2">

        <!-- INLINE LOGO -->
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none"
             xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="14" fill="#2563EB"/>
            <path d="M20 42V22H26L32 30L38 22H44V42H38V31L32 39L26 31V42H20Z"
                  fill="white"/>
        </svg>

        <span class="navbar-brand fw-semibold fs-5">
      Mthree Placement
    </span>
    </div>

    <button class="btn btn-outline-light btn-sm">Logout</button>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>

            <a class="active" href="company-dashboard.html">
                <i class="bi bi-grid"></i> Dashboard
            </a>

            <a href="company-jobs.html">
                <i class="bi bi-briefcase"></i> My Jobs
            </a>

            <a href="company-applications.html">
                <i class="bi bi-people"></i> Applications
            </a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 p-4">

            <h4 class="fw-semibold mb-4">
                Welcome, <span class="text-primary"> Recruiters</span>
            </h4>

            <!-- METRIC CARDS -->
            <div class="row g-4 mb-4">

                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-briefcase fs-2 text-primary"></i>
                        <h6 class="mt-2 text-muted">Posted Jobs</h6>
                        <h2 class="fw-bold" id="postedJobsCount">0</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-people fs-2 text-success"></i>
                        <h6 class="mt-2 text-muted">Applications</h6>
                        <h2 class="fw-bold" id="applicationsCount">0</h2>
                    </div>
                </div>

            </div>

            <!-- QUICK ACTIONS -->
            <div class="glass-card p-4">
                <h6 class="fw-semibold mb-3">Quick Actions</h6>

                <a href="company-post-job.html" class="btn btn-primary me-2">
                    <i class="bi bi-plus-circle"></i> Post New Job
                </a>

                <a href="company-applications.html" class="btn btn-outline-secondary">
                    <i class="bi bi-eye"></i> View Applications
                </a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- DASHBOARD JS -->
<script>
    const COMPANY_ID = 1; // demo company (TCS)

    async function loadDashboardData() {
        try {
            const response = await fetch("http://localhost:8083/api/jobs/list");
            const jobs = await response.json();

            // Filter jobs by company
            const companyJobs = jobs.filter(
                job => job.companyId === COMPANY_ID
            );

            // Update job count
            document.getElementById("postedJobsCount").innerText =
                companyJobs.length;

            // Demo application count (replace later with Application Service)
            let applications = 0;
            companyJobs.forEach(job => {
                applications += job.applicationCount || 5;
            });

            document.getElementById("applicationsCount").innerText =
                applications;

        } catch (err) {
            console.error("Dashboard load error:", err);
        }
    }

    window.onload = loadDashboardData;
</script>

</body>
</html>
