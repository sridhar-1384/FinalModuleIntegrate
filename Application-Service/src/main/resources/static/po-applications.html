<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>All Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }
        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }
        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">Placement Management System</span>
    <button class="btn btn-outline-light btn-sm" id="login">
        Login
    </button>
</nav>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">PO Menu</h6>
            <a href="#"><i class="bi bi-grid me-2"></i>Dashboard</a>
            <a href="#"><i class="bi bi-people me-2"></i>Students</a>
            <a href="#"><i class="bi bi-building me-2"></i>Companies</a>
            <a href="#" class="active"><i class="bi bi-file-earmark-text me-2"></i>Applications</a>
        </div>
        <div class="col-md-10 p-4">
            <h4 class="fw-semibold mb-4">All Applications</h4>

            <div class="glass-card p-0 overflow-hidden">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="p-3">Student</th>
                        <th class="p-3">Company</th>
                        <th class="p-3">Job Title</th>
                        <th class="p-3">Applied Date</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-end">Action</th>
                    </tr>
                    </thead>
                    <tbody id="applications-table-body">
                    <tr>
                        <td colspan="6" class="text-center p-4">Loading data...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const sec = document.getElementById('login');
    let token = sessionStorage.getItem('sessionToken');
    token ? (sec.innerHTML = 'Logout') : (sec.innerHTML = 'Login');
    sec.addEventListener("click",()=>{
        console.log("clicked")
        if(token) sessionStorage.clear()
        window.location.href="/login.html"
    })

    const API_BASE = "http://localhost:8084/api/applications";
    const login_page = "login.html";

    document.addEventListener("DOMContentLoaded", fetchApplications);
    async function fetchApplications() {
        const tbody = document.getElementById("applications-table-body");

        if (!token ){
            alert("Please login first.");
            window.location.href = login_page;
            return;
        }

        try {
            const headers = { "Content-Type": "application/json" };
            if (token) headers["SESSION-TOKEN"] = token;

            // Fetch All Applications (PO View)
            const response = await fetch(`${API_BASE}/list`, {
                method: "GET",
                headers: headers,
            });

            // Handle Auth Errors
            if (response.status === 401) {
                alert("Session Expired. Please login again.");
                return;
            }
            if (response.status === 403) {
                alert("Access Denied: Only Placement Officers can view this.");
                return;
            }
            if (!response.ok)
                throw new Error("API Request Failed");

            const applications = await response.json();

            if (applications.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-4">No applications found in the system.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            applications.forEach((app) => {
                const row = `
                            <tr>
                                <td class="p-3 fw-bold">${app.studentName || "ID: " + app.studentId}</td>
                                <td class="p-3">${app.companyName || "-"}</td>
                                <td class="p-3">${app.jobTitle || "Job ID: " + app.jobId}</td>
                                <td class="p-3">${app.appliedDate}</td>
                                <td class="p-3"><span class="badge bg-secondary">${app.status}</span></td>
                                <td class="p-3 text-end">
                                    <a href="application-details.html?id=${app.id}" class="btn btn-primary btn-sm">View Details</a>
                                </td>
                            </tr>`;
                tbody.innerHTML += row;
            });
        } catch (e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Connection failed.</td></tr>`;
        }
    }
</script>
</body>
</html>
