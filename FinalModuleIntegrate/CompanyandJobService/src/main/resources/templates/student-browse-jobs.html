<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mthree Placement | Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }
        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }
        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }
        .glass-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <div class="d-flex align-items-center gap-2">
        <svg width="34" height="34" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#2563EB"/>
            <path d="M20 42V22H26L32 30L38 22H44V42H38V31L32 39L26 31V42H20Z" fill="white"/>
        </svg>
        <span class="navbar-brand fw-semibold">Mthree Placement</span>
    </div>
    <button class="btn btn-outline-light btn-sm">Logout</button>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-3">
            <a href="student-dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
            <a href="profile.html"><i class="bi bi-person"></i> Profile</a>
            <a class="active" href="#"><i class="bi bi-briefcase"></i> Jobs</a>
            <a href="my-applications.html"><i class="bi bi-people"></i> My Applications</a>
        </div>

        <!-- MAIN -->
        <div class="col-md-10 p-4">
            <h4 class="fw-semibold mb-4">Available Jobs</h4>

            <!-- JOB CARDS -->
            <div th:each="job, stat : ${jobs}" class="glass-card p-4 mb-3">

                <!-- Title -->
                <h5 class="fw-semibold"
                    th:text="${job.companyName + ' - ' + job.roleName}">
                    Company - Role
                </h5>

                <!-- Info -->
                <p class="mb-1">
                    Package: <span th:text="${job.packages}"></span> LPA |
                    Location: <span th:text="${job.location}"></span>
                </p>

                <p>
                    Min CGPA: <span th:text="${job.min_gpa}"></span> |
                    Deadline: <span th:text="${job.deadline}"></span>
                </p>

                <!-- Buttons -->
                <button class="btn btn-outline-primary btn-sm me-2"
                        th:onclick="'toggleDesc(' + ${stat.index} + ', this)'">
                    View Details
                </button>

                <button class="btn btn-success btn-sm"
                        th:attr="data-jobid=${job.jobId},data-studentid=${job.studentId}"
                        onclick="applyJob(this)">
                    Apply Now
                </button>

                <!-- Hidden Description -->
                <div class="mt-3 text-muted"
                     th:id="'desc-' + ${stat.index}"
                     style="max-height:0; overflow:hidden; transition:0.3s ease;">
                    <b>Description:</b>
                    <span th:text="${job.description}"></span>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script>
    function toggleDesc(index, btn) {
        const desc = document.getElementById("desc-" + index);

        if (!desc.style.maxHeight || desc.style.maxHeight === "0px") {
            desc.style.maxHeight = desc.scrollHeight + "px";
            btn.innerText = "Hide Details";
        } else {
            desc.style.maxHeight = "0px";
            btn.innerText = "View Details";
        }
    }

    function applyJob(button) {

        const jobId = button.getAttribute("data-jobid");
        const studentId = button.getAttribute("data-studentid");

        const payload = {
            id: null,
            student_id: studentId,
            job_id: jobId,
            applied_date: new Date().toISOString().split('T')[0],
            status: "APPLIED"
        };

        fetch("http://localhost:8084/api/applications/apply", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (res.ok) {
                alert(" Applied Successfully!");
                button.disabled = true;
                button.innerText = "Applied";
            } else {
                alert(" Failed to apply");
            }
        })
        .catch(err => {
            console.error(err);
            alert("Error occurred");
        });
    }
</script>

</body>
</html>
