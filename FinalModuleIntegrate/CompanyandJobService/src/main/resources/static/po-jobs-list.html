<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>PO - All Jobs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <style>
        body {
            background: #f4f6f9;
        }

        /* Topbar */
        .topbar {
            background: #1f2937;
            color: #fff;
            padding: 12px 20px;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            background: #0f172a;
            color: #fff;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar a:hover,
        .sidebar .active {
            background: #1e293b;
            color: #fff;
        }

        /* Job Card */
        .job-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
        }

        .job-title {
            font-weight: 600;
            font-size: 18px;
        }

        .badge-status {
            font-size: 13px;
            padding: 6px 10px;
        }
    </style>
</head>
<body>
<!-- Top Bar -->
<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Placement Management System</h5>
    <button class="btn btn-outline-light btn-sm">Logout</button>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary">Menu</h6>
            <a href="#">Dashboard</a>
            <a href="#" class="active">All Jobs</a>
            <a href="#">Companies</a>
            <a href="#">Students</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <h4 class="mb-4">All Jobs</h4>

            <!-- Job 1 -->
            <div
                    class="job-card d-flex justify-content-between align-items-center"
            >
                <div>
                    <div class="job-title">Software Engineer</div>
                    <small class="text-muted">Company: TCS</small>
                </div>

                <div><strong>CTC:</strong> 7 LPA</div>

                <div><strong>Eligibility:</strong> CGPA ≥ 7.0</div>

                <div>
                            <span class="badge bg-success badge-status"
                            >Open</span
                            >
                </div>

                <div>
                    <button class="btn btn-outline-primary btn-sm">
                        View
                    </button>
                </div>
            </div>

            <!-- Job 2 -->
            <div
                    class="job-card d-flex justify-content-between align-items-center"
            >
                <div>
                    <div class="job-title">Data Analyst</div>
                    <small class="text-muted">Company: Infosys</small>
                </div>

                <div><strong>CTC:</strong> 6 LPA</div>

                <div><strong>Eligibility:</strong> CGPA ≥ 6.5</div>

                <div>
                            <span
                                    class="badge bg-warning text-dark badge-status"
                            >Closed</span
                            >
                </div>

                <div>
                    <button class="btn btn-outline-secondary btn-sm">
                        View
                    </button>
                </div>
            </div>

            <!-- Job 3 -->
            <div
                    class="job-card d-flex justify-content-between align-items-center"
            >
                <div>
                    <div class="job-title">Web Developer</div>
                    <small class="text-muted">Company: Wipro</small>
                </div>

                <div><strong>CTC:</strong> 5 LPA</div>

                <div><strong>Eligibility:</strong> CGPA ≥ 6.0</div>

                <div>
                            <span class="badge bg-success badge-status"
                            >Open</span
                            >
                </div>

                <div>
                    <button class="btn btn-outline-primary btn-sm">
                        View
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
