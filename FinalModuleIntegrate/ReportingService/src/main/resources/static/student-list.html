<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Student List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/admin-dashboard.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">Placement Management System</span>
    <button class="btn btn-outline-light btn-sm" id="login">Login</button>
    <script>
        const sec = document.getElementById('login');
        let token = sessionStorage.getItem('sessionToken');
        token ? (sec.innerHTML = 'Logout') : (sec.innerHTML = 'Login');
        sec.addEventListener("click",()=>{
            if(token) sessionStorage.clear()
            window.location.href="/login.html"
        })
    </script>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>
            <a href="po-dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a>
            <a class="active" href="#"><i class="bi bi-people me-2"></i>Students</a>
            <a href="student-stats.html"><i class="bi bi-bar-chart me-2"></i>Student Statistics</a>
            <a href="company-report.html"><i class="bi bi-bar-chart me-2"></i>Company Report</a>
        </div>

        <!-- Main -->
        <div class="col-md-10 p-4">
            <div class="report-title-box">
                <h4 class="fw-semibold mb-0">Student List</h4>
            </div>

            <div class="glass-card p-4">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Applications</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function getStatusBadge(status) {
        switch (status) {
            case "SELECTED":
            case "PLACED":
                return `<span class="badge bg-success-subtle text-success-emphasis">Selected</span>`;
            case "SHORTLISTED":
            case "IN_PROCESS":
                return `<span class="badge bg-warning-subtle text-warning-emphasis">Shortlisted</span>`;
            case "APPLIED":
                return `<span class="badge bg-primary-subtle text-primary-emphasis">Applied</span>`;
            case "NOT_SELECTED":
                return `<span class="badge bg-danger-subtle text-danger-emphasis">Not Selected</span>`;
            case "NOT_APPLIED":
            default:
                return `<span class="badge bg-secondary-subtle text-secondary-emphasis">Not Applied</span>`;
        }
    }

    function viewReport(id) {
        window.location.href = `student-report.html?id=${id}`;
    }

    async function loadStudents() {
        const tbody = document.getElementById("studentTableBody");
        tbody.innerHTML = "";

        // const token = sessionStorage.getItem("sessionToken");
        // if (!token) {
        //     alert("Session expired. Please login again.");
        //     window.location.href = "/login.html";
        //     return;
        // }

        try {
            // 1. Fetch students
            const studentsRes = await fetch("http://localhost:8082/api/students/list");

            // const studentsRes = await fetch("http://localhost:8082/api/students/list", {
            //     headers: {
            //         "X-SESSION-TOKEN": token
            //     }
            // });


            const students = await studentsRes.json();

            for (const s of students) {
                const id = s.id;
                const name = s.name || "Student";

                // 2. Fetch report stats for each student
                const statsRes = await fetch(`http://localhost:8085/api/reports/student/${id}`);

                // const statsRes = await fetch(`http://localhost:8085/api/reports/student/${id}`, {
                //     headers: {
                //         "X-SESSION-TOKEN": token
                //     }
                // });

                const stats = await statsRes.json();

                const applications = stats.totalApplications || 0;
                const shortlisted = stats.shortlisted || 0;

                let status = "NOT_APPLIED";

                // Check if any application is SELECTED
                if (stats.history && stats.history.some(h => h.status === "SELECTED")) {
                    status = "SELECTED";
                } else if (shortlisted > 0) {
                    status = "SHORTLISTED";
                } else if (applications > 0) {
                    status = "APPLIED";
                }

                const row = `
                    <tr>
                        <td>${id}</td>
                        <td>${name}</td>
                        <td>${applications}</td>
                        <td>${getStatusBadge(status)}</td>
                        <td>
                            <button class="btn action-btn btn-sm" onclick="viewReport(${id})">
                                <i class="bi bi-eye me-1"></i> View Report
                            </button>
                        </td>
                    </tr>
                `;

                tbody.innerHTML += row;
            }

        } catch (e) {
            console.error("Failed to load students:", e);
        }
    }

    loadStudents();
</script>

</body>
</html>
