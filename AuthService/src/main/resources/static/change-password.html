<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <!-- Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"
    />

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }

        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }

        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 420px;
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">
        Placement Management System
    </span>
    <button class="btn btn-outline-light btn-sm" id="login">
        Login
    </button>
</nav>

<script>
    const sec = document.getElementById('login');
    let token = sessionStorage.getItem('sessionToken');
    sec.innerHTML = token ? 'Logout' : 'Login';

    sec.addEventListener("click", () => {
        if (token) sessionStorage.clear();
        window.location.href = "/login.html";
    });
</script>

<div class="container-fluid">




        <!-- MAIN CONTENT -->
        <div class=" d-flex justify-content-center align-items-center">

            <div class="glass-card p-4">
                <h4 class="text-center mb-3">🔒 Change Password</h4>
                <p class="text-center text-muted mb-4">
                    Update your account password
                </p>

                <form id="changePwdForm">

                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input
                                type="password"
                                id="currentPassword"
                                class="form-control"
                                placeholder="Enter current password"
                                required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input
                                type="password"
                                id="newPassword"
                                class="form-control"
                                placeholder="Enter new password"
                                required
                        />
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Update Password
                    </button>

                    <button type="button"
                            class="btn btn-secondary w-100 mt-2"
                            onclick="window.history.back()">
                        Back
                    </button>

                    <div id="message" class="text-center text-danger mt-3"></div>

                </form>
            </div>

        </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Existing JS -->
<script src="change-password.js"></script>

</body>
</html>
