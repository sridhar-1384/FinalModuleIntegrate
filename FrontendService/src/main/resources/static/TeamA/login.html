<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <!-- Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"
    />

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }
        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }
        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>
<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
            <span class="navbar-brand fw-semibold"
            >Placement Management System</span
            >
    <button class="btn btn-outline-light btn-sm" id="login">
        Login
    </button>
    <script>
        const sec = document.getElementById('login');
        let token = sessionStorage.getItem('sessionToken');
        token ? (sec.innerHTML = 'Logout') : (sec.innerHTML = 'Login');
        sec.addEventListener("click",()=>{
            console.log("clicked")
            if(token) sessionStorage.clear()
            window.location.href="/login.html"
        })
    </script>
</nav>

<div class="container-fluid">

        <!-- MAIN -->
        <div class="bg-light  p-4">
            <div class="container vh-100 d-flex justify-content-center align-items-center">
                <div class="card shadow p-4" style="width: 400px;">

                    <h3 class="text-center mb-3">🎓 Placement System</h3>
                    <h5 class="text-center text-muted mb-4">Login</h5>

                    <!-- Login Form -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password">
                    </div>

                    <button class="btn btn-primary w-100" onclick="login()">Login</button>
                    <div id="errorMsg" class="text-danger text-center mt-2"></div>
                    <div class="text-center mt-3">
                        <small class="text-muted">New User ?</small>
                    </div>
                    <div class="row">
                        <div class="col"><a href="student-register.html">Student Registration</a></div>
                        <div class="col"><a href="company-register.html">Company Registration</a></div>
                    </div>


                </div>
            </div>
        </div>

</div>
<script>
    async function login() {

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const displayError=document.getElementById("errorMsg");

        if(email.length=0 || password.length==0){
            displayError.innerText = "All fields required";
            return;
        }

        const res = await fetch("http://localhost:8081/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            displayError.innerText = "Invalid email or password";
            return;
        }

        const data = await res.json();
        console.log(data);

        const user = await fetch('http://localhost:8081/api/auth/validate', {
                     method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                         'SESSION-TOKEN': data.sessionToken,
                     },
                 });

                 const details = await user.json();
                 console.log(details);

                let loc;
                 if (details.role == "STUDENT") loc = '/TeamB/student.html';
                else if (details.role == "COMPANY_HR")
                    loc = '/TeamC/company-dashboard.html';
                 else loc = '/TeamE/po-dashboard.html';

        // Store session token
        sessionStorage.setItem("sessionToken", data.sessionToken);

        // redirect after login
        window.location.href = loc;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
