<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Student Registration</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"
    />

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
<!-- Navbar (unchanged) -->
<nav class="navbar navbar-dark bg-dark px-4">
            <span class="navbar-brand fw-semibold">
                Placement Management System
            </span>
    <button class="btn btn-outline-light btn-sm" id="login">
        Login
    </button>
    <script>
        const sec = document.getElementById('login');
        sessionStorage.clear();
        sec.addEventListener('click', () => {
            window.location.href = '/TeamA/login.html';
        });
    </script>
</nav>

<div class="container-fluid">
    <div
            class="row min-vh-100 justify-content-center align-items-center"
    >
        <div class="col-md-5 col-lg-4">
            <div class="glass-card p-4">
                <h4 class="fw-semibold mb-4 text-center">
                    Student Registration
                </h4>

                <form id="regForm">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input
                                type="text"
                                id="name"
                                class="form-control"
                                required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input
                                type="text"
                                id="phone"
                                class="form-control"
                                maxlength="10"
                                required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select
                                id="department"
                                class="form-select"
                                required
                        >
                            <option value="">
                                -- Select Department --
                            </option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="IT">IT</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CGPA</label>
                        <input
                                type="number"
                                id="cgpa"
                                class="form-control"
                                min="0"
                                max="10"
                                step="0.01"
                                required
                        />
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            Register
                        </button>

                        <a
                                href="login.html"
                                class="btn btn-outline-secondary"
                        >
                            Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="student-register.js"></script>
</body>
</html>
