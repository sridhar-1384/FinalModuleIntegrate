<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Company Dashboard</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <!-- Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"
    />

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }
        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }
        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
            <span class="navbar-brand fw-semibold"
            >Placement Management System</span
            >
    <button class="btn btn-outline-light btn-sm">Logout</button>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>
            <a href="company-dashboard.html">
                <i class="bi bi-grid"></i> Dashboard
            </a>

            <a href="company-jobs.html">
                <i class="bi bi-briefcase"></i> My Jobs
            </a>

            <a href="company-applications.html">
                <i class="bi bi-people"></i> Applications
            </a>
        </div>

        <!-- MAIN -->
        <div class="col-md-10 p-4">
            <h4 class="fw-semibold mb-4">
                Welcome, <span class="text-primary">TCS Recruiter</span>
            </h4>

            <!-- METRIC CARDS -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <i
                                class="bi bi-briefcase fs-2 text-primary"
                        ></i>
                        <h6 class="mt-2 text-muted">Posted Jobs</h6>
                        <h2 class="fw-bold">2</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-people fs-2 text-success"></i>
                        <h6 class="mt-2 text-muted">Applications</h6>
                        <h2 class="fw-bold">15</h2>
                    </div>
                </div>
            </div>

            <!-- QUICK ACTIONS -->
            <div class="glass-card p-4">
                <h6 class="fw-semibold mb-3">Quick Actions</h6>
                <a
                        href="company-post-job.html"
                        class="btn btn-primary me-2"
                >
                    <i class="bi bi-plus-circle"></i> Post New Job
                </a>
                <a href="#" class="btn btn-outline-secondary">
                    <i class="bi bi-eye"></i> View Applications
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
