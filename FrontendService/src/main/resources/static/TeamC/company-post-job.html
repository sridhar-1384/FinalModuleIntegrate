<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mthree Placement | Post Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background: linear-gradient(135deg, #eef2f7, #f8f9fb); }
        .sidebar { background: #0f172a; min-height: 100vh; }
        .sidebar a {
            color: #cbd5e1; padding: 12px; border-radius: 8px; margin-bottom: 6px;
            display: block; text-decoration: none;
        }
        .sidebar a:hover, .sidebar a.active { background: #1e293b; color: #fff; }
        .glass-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<!-- AUTH GUARD -->
<script>
    const token = sessionStorage.getItem("sessionToken");
    console.log("here pavan doing ",token);
    if (!token) {
        alert("Session expired. Please login again.");
        window.location.href = "/TeamA/login.html";
    }
</script>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <div class="d-flex align-items-center gap-2">
        <svg width="34" height="34" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#2563EB"/>
            <path d="M20 42V22H26L32 30L38 22H44V42H38V31L32 39L26 31V42H20Z" fill="white"/>
        </svg>
        <span class="navbar-brand fw-semibold">Mthree Placement</span>
    </div>
    <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-3">
            <a href="company-dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
            <a href="company-jobs.html"><i class="bi bi-briefcase"></i> My Jobs</a>
            <a href="company-applications.html"><i class="bi bi-people"></i> Applications</a>
        </div>

        <!-- MAIN -->
        <div class="col-md-10 p-4">
            <h4 class="fw-semibold mb-4">Post New Job</h4>

            <div class="glass-card p-4 col-md-8">
                <form id="postJobForm">

                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea class="form-control" id="description" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Package (LPA)</label>
                            <input type="number" class="form-control" id="packageLpa" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Minimum CGPA</label>
                            <input type="number" step="0.1" class="form-control" id="minCgpa" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Deadline</label>
                            <input type="date" class="form-control" id="deadline" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Post Job
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const JOB_SERVICE_URL = "http://localhost:8083/api/jobs/create";

    // LOGOUT
    document.getElementById("logoutBtn").onclick = () => {
        sessionStorage.removeItem("sessionToken");
        window.location.href = "/TeamA/login.html";
    };

    document.getElementById("postJobForm").addEventListener("submit", async function (e) {
        e.preventDefault();


        // STEP 1 → current user
        const userRes = await fetch("http://localhost:8081/api/auth/current-user", {
            headers: {
                "SESSION-TOKEN": token
            }
        });


        const user = await userRes.json();

        const userId = user.userId;


        // STEP 2 → company details
        const companyRes = await fetch(
            `http://localhost:8083/api/companies/userId/${userId}`,
            {
                headers: {
                    "SESSION-TOKEN": token
                }
            }
        );

        console.log("Company API status =", companyRes.status);

        const company = await companyRes.json();

        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const packageLpa = document.getElementById("packageLpa");
        const locationInput = document.getElementById("location");
        const minCgpa = document.getElementById("minCgpa");
        const deadline = document.getElementById("deadline");


        const jobData = {
            title: title.value,
            description: description.value,
            packageLpa: Number(packageLpa.value),
            location: locationInput.value,
            minCgpa: Number(minCgpa.value),
            deadline: deadline.value,
            companyId:company.id,
        };

        console.log("Job Data pavan:", jobData);

        try {
            const response = await fetch(JOB_SERVICE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "SESSION-TOKEN": token
                },
                body: JSON.stringify(jobData)
            });

            if (response.status === 401) {
                sessionStorage.clear();
                window.location.href = "/TeamA/login.html";
                return;
            }

            if (response.status === 403) {
                alert("Access denied. Only Company HR can post jobs.");
                return;
            }

            if (response.ok) {
                alert("✅ Job posted successfully!");
                window.location.href = "company-jobs.html";
            } else {
                alert("❌ Failed to post job");
            }

        } catch (error) {
            console.error("Error:", error);
            alert("❌ Backend not reachable");
        }
    });
</script>

</body>
</html>
