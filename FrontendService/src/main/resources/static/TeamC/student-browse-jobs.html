<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal | Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="student.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light app-navbar fixed-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold">
            <i class="fas fa-graduation-cap me-2"></i>Student Portal
        </span>

        <div class="d-flex gap-3 align-items-center">
            <div class="user-info">
                <i class="fas fa-user-circle me-2"></i>
                <span id="navUser" class="text-muted"></span>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </div>
</nav>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-title">Navigation</div>

        <a class="sidebar-link" onclick="goPage('/TeamB/student.html')">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>

        <a class="sidebar-link active">
            <i class="fas fa-briefcase"></i>
            <span>Jobs</span>
        </a>

        <a class="sidebar-link" onclick="goPage('/TeamB/ShowNoti.html')">
            <i class="fas fa-bell"></i>
            <span>Notifications</span>
        </a>

        <a class="sidebar-link" onclick="goPage('/TeamB/student-applications.html')">
            <i class="fas fa-folder-open"></i>
            <span>My Applications</span>
        </a>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <!-- HEADER -->
        <div class="page-header mb-4">
            <h3 class="page-title">
                <i class="fas fa-briefcase me-2"></i>Available Jobs
            </h3>
            <p class="page-subtitle">Explore and apply to opportunities</p>
        </div>

        <!-- SEARCH / FILTER -->
        <div class="card p-3 mb-4">
            <div class="row g-3">

                <div class="col-md-4">
                    <input type="text"
                           id="searchText"
                           class="form-control"
                           placeholder="Search company or job title">
                </div>

                <div class="col-md-2">
                    <input type="number"
                           id="minPackage"
                           class="form-control"
                           placeholder="Min LPA">
                </div>

                <div class="col-md-2">
                    <input type="number"
                           id="maxPackage"
                           class="form-control"
                           placeholder="Max LPA">
                </div>

                <div class="col-md-3">
                    <select id="locationFilter" class="form-select">
                        <option value="">All Locations</option>
                    </select>
                </div>

                <div class="col-md-1">
                    <button class="btn btn-primary w-100" onclick="applyFilters()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- JOB LIST -->
        <div id="jobContainer"></div>

    </main>
</div>

<script>

    let allJobs = []; // store original jobs
    let token=null;
    let student=null;
    let currentStudentid=null;

    function goPage(page) {
        window.location.href = page;
    }

    function logout() {
        sessionStorage.removeItem("SESSION-TOKEN");
        window.location.href = "/TeamA/login.html";
    }

    document.addEventListener("DOMContentLoaded", loadJobs);

    async function loadJobs() {

        token = sessionStorage.getItem("sessionToken");

        if (!token) {
            window.location.href = "/TeamA/login.html";
            return;
        }

        // STEP 1 → current user
        const userRes = await fetch("http://localhost:8081/api/auth/current-user", {
            headers: {
                "SESSION-TOKEN": token
            }
        });


        const user = await userRes.json();

        const userId = user.userId;


        // STEP 2 → company details
        const studentRes = await fetch(
            `http://localhost:8082/api/students/userId/${userId}`,
            {
                headers: {
                    "SESSION-TOKEN": token
                }
            }
        );

        console.log("Company API status =", studentRes.status);

         student = await studentRes.json();
         currentStudentId=student.id;
         document.getElementById("navUser").innerText = student.name || "User";



        try {
            const jobRes = await fetch("http://localhost:8083/api/jobs/list", {
                headers: { "SESSION-TOKEN": token }
            });

            if (!jobRes.ok) throw new Error("Jobs fetch failed");

            allJobs = await jobRes.json();

            populateLocations(allJobs);
            console.log("Before renderJobs token:",token);
            renderJobs(allJobs,student);

        } catch (err) {
            console.error(err);
            alert("Failed to load jobs");
        }
    }

    // create unique locations
    function populateLocations(jobs) {
        const select = document.getElementById("locationFilter");

        const unique = [...new Set(jobs.map(j => j.location))];

        unique.forEach(loc => {
            const option = document.createElement("option");
            option.value = loc;
            option.textContent = loc;
            select.appendChild(option);
        });
    }

   async function renderJobs(jobs, student) {

    const container = document.getElementById("jobContainer");
    container.innerHTML = "";

    if (jobs.length === 0) {
        container.innerHTML = `<div class="alert alert-info">No jobs found</div>`;
        return;
    }

    for (let i = 0; i < jobs.length; i++) {

        const job = jobs[i];

        let alreadyApplied = false;

        try {
            const res = await fetch(
                `http://localhost:8084/api/applications/job/${job.id}`,
                {
                    headers: { "SESSION-TOKEN": token }
                }
            );

            if (res.ok) {
                const applications = await res.json();

                alreadyApplied = applications.some(
                    app => app.studentId == student.id
                );
            }
        } catch (e) {
            console.error("Application check failed", e);
        }

        const card = document.createElement("div");
        card.className = "card p-4 mb-4";

        card.innerHTML = `
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="fw-semibold mb-0">
                    <i class="fas fa-building me-2 text-primary"></i>
                    ${job.companyName}
                </h5>
                <span class="badge bg-success fs-5 fw-bold px-4 py-2 shadow-sm">
                    ₹ ${job.packageLpa} LPA
                </span>
            </div>

            <div class="text-muted mb-2">
                <i class="fas fa-user-tie me-2"></i>${job.title}
            </div>

            <div class="row mb-2">
                <div class="col-md-6">
                    <i class="fas fa-map-marker-alt me-2 text-danger"></i>${job.location}
                </div>
                <div class="col-md-6">
                    <i class="fas fa-chart-line me-2 text-warning"></i>
                    Min CGPA: ${job.minCgpa}
                </div>
            </div>

            <div class="mb-3">
                <i class="fas fa-calendar me-2 text-info"></i>
                Deadline: ${job.deadline}
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm"
                        onclick="toggleDesc(${i}, this)">
                    View Details
                </button>

                <button class="btn ${alreadyApplied ? 'btn-secondary' : 'btn-success'} btn-sm"
                        data-jobid="${job.id}"
                        data-studentid="${student.id}"
                        onclick="applyJob(this)"
                        ${alreadyApplied ? 'disabled' : ''}>
                    ${alreadyApplied ? 'Applied' : 'Apply Now'}
                </button>
            </div>

            <div class="mt-3 text-muted"
                 id="desc-${i}"
                 style="max-height:0; overflow:hidden; transition:0.3s ease;">
                <b>Description:</b> ${job.description}
            </div>
        `;

        container.appendChild(card);
    }
}


    // APPLY FILTERS
    function applyFilters() {

        const text = document.getElementById("searchText").value.toLowerCase();
        const min = document.getElementById("minPackage").value;
        const max = document.getElementById("maxPackage").value;
        const location = document.getElementById("locationFilter").value;

        const filtered = allJobs.filter(job => {

            const matchText =
                job.companyName.toLowerCase().includes(text) ||
                job.title.toLowerCase().includes(text);

            const matchMin = min ? job.packageLpa >= min : true;
            const matchMax = max ? job.packageLpa <= max : true;
            const matchLoc = location ? job.location === location : true;

            return matchText && matchMin && matchMax && matchLoc;
        });

        renderJobs(filtered);
    }

    function toggleDesc(index, btn) {
        const desc = document.getElementById("desc-" + index);

        if (!desc.style.maxHeight || desc.style.maxHeight === "0px") {
            desc.style.maxHeight = desc.scrollHeight + "px";
            btn.innerText = "Hide Details";
        } else {
            desc.style.maxHeight = "0px";
            btn.innerText = "View Details";
        }
    }

    function applyJob(button) {

        console.log("inside applyJob token:",token);

        const jobId = button.getAttribute("data-jobid");
       const studentId = button.getAttribute("data-studentid");

       const payload = {
           studentId: studentId,
           jobId: jobId
       };

       console.log("Pavan  this is the payload:",payload);

       fetch("http://localhost:8084/api/applications/apply", {
           method: "POST",
           headers: {
               "Content-Type": "application/json",
               "SESSION-TOKEN":token
           },
           body: JSON.stringify(payload)
       })
       .then(res => {
           if (res.ok) {
               alert(" Applied Successfully!");
               button.disabled = true;
               button.innerText = "Applied";
           } else {
               alert(" Failed to apply");
           }
       })
       .catch(err => {
           console.error(err);
           alert("Error occurred");
       });

    }
    function goPage(page) {
    if (page === '/TeamB/student-applications.html' && currentStudentId) {
            window.location.href = `${page}?studentId=${currentStudentId}`;
        } else {
            window.location.href = page;
        }
}

</script>

</body>
</html>
