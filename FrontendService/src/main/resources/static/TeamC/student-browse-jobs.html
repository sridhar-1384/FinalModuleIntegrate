<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mthree Placement | Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
        }
        .sidebar {
            background: #0f172a;
            min-height: 100vh;
        }
        .sidebar a {
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background: #1e293b;
            color: #fff;
        }
        .glass-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

    const token = sessionStorage.getItem("SESSION-TOKEN");

        alert("Session expired. Please login again.");
        window.location.href = "login.html";

</script> -->

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <div class="d-flex align-items-center gap-2">
        <svg width="34" height="34" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#2563EB"/>
            <path d="M20 42V22H26L32 30L38 22H44V42H38V31L32 39L26 31V42H20Z" fill="white"/>
        </svg>
        <span class="navbar-brand fw-semibold">Mthree Placement</span>
    </div>
    <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-3">
            <a href="student-dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
            <a href="profile.html"><i class="bi bi-person"></i> Profile</a>
            <a class="active" href="#"><i class="bi bi-briefcase"></i> Jobs</a>
            <a href="my-applications.html"><i class="bi bi-people"></i> My Applications</a>
        </div>

        <!-- MAIN -->
        <div class="col-md-10 p-4">
            <h4 class="fw-semibold mb-4">Available Jobs</h4>

            <!-- container -->
            <div id="jobContainer"></div>

        </div>

    </div>
</div>

<!-- JS -->
<script>

    // LOGOUT
   document.getElementById("logoutBtn").onclick = () => {
       sessionStorage.removeItem("SESSION-TOKEN");
       window.location.href = "login.html";
   };

   //LOAD

    document.addEventListener("DOMContentLoaded", loadJobs);
    async function loadJobs() {

    const token = sessionStorage.getItem("SESSION-TOKEN");

    if (!token) {
        window.location.href = "/login.html";
        return;
    }

    try {
        // fetch jobs
        const jobRes = await fetch("http://localhost:8083/api/jobs/list", {
            headers: { "SESSION-TOKEN": token }
        });

        if (!jobRes.ok) throw new Error("Jobs fetch failed");

        const jobs = await jobRes.json();
        console.log("JOBS:"+jobs);


        const container = document.getElementById("jobContainer");
        container.innerHTML = "";

        // for each job → fetch company
        for (let i = 0; i < jobs.length; i++) {

            const job = jobs[i];
            console.log(Object.keys(job));


            const card = document.createElement("div");
            card.className = "glass-card p-4 mb-3";

            card.innerHTML = `
                <h5 class="fw-semibold">
                    ${job.companyName} - ${job.title}
                </h5>

                <p class="mb-1">
                    Package: ${job.packageLpa} LPA |
                    Location: ${job.location}
                </p>

                <p>
                    Min CGPA: ${job.minCgpa} |
                    Deadline: ${job.deadline}
                </p>

                <button class="btn btn-outline-primary btn-sm me-2"
                        onclick="toggleDesc(${i})">
                    View Details
                </button>

                <button class="btn btn-success btn-sm"
                        onclick="applyJob(${job.jobId}, ${job.studentId}, this)">
                    Apply Now
                </button>

                <div class="mt-3 text-muted"
                     id="desc-${i}"
                     style="max-height:0; overflow:hidden; transition:0.3s ease;">
                    <b>Description:</b> ${job.description}
                </div>
            `;

            container.appendChild(card);
        }

    } catch (err) {
        console.error(err);
        alert("Failed to load jobs");
    }
}

   function toggleDesc(index, btn) {
       const desc = document.getElementById("desc-" + index);

       if (!desc.style.maxHeight || desc.style.maxHeight === "0px") {
           desc.style.maxHeight = desc.scrollHeight + "px";
           btn.innerText = "Hide Details";
       } else {
           desc.style.maxHeight = "0px";
           btn.innerText = "View Details";
       }
   }

   function applyJob(button) {

       const jobId = button.getAttribute("data-jobid");
       const studentId = button.getAttribute("data-studentid");

       const payload = {
           id: null,
           student_id: studentId,
           job_id: jobId,
           applied_date: new Date().toISOString().split('T')[0],
           status: "APPLIED"
       };

       fetch("http://localhost:8084/api/applications/apply", {
           method: "POST",
           headers: {
               "Content-Type": "application/json"
           },
           body: JSON.stringify(payload)
       })
       .then(res => {
           if (res.ok) {
               alert(" Applied Successfully!");
               button.disabled = true;
               button.innerText = "Applied";
           } else {
               alert(" Failed to apply");
           }
       })
       .catch(err => {
           console.error(err);
           alert("Error occurred");
       });
   }
</script>

</body>
</html>
