<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Student Report</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/admin-dashboard.css">

    <style>
        /* Muted status colors */
        .status-selected { color: #2f855a; font-weight: 600; }
        .status-shortlisted { color: #b7791f; font-weight: 600; }
        .status-inprocess { color: #b7791f; font-weight: 600; }
        .status-applied { color: #2b6cb0; font-weight: 600; }
        .status-notapplied { color: #718096; font-weight: 600; }
        .status-notselected { color: #9b2c2c; font-weight: 600; }
    </style>
</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">Placement Management System</span>
    <button class="btn btn-outline-light btn-sm" id="login">Login</button>
    <script>
        const sec = document.getElementById('login');
        let token = sessionStorage.getItem('sessionToken');
        sec.innerHTML = token ? 'Logout' : 'Login';
        sec.addEventListener("click",()=>{
            if(token) sessionStorage.clear();
            window.location.href = "/TeamA/login.html";
        });
    </script>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h6 class="text-uppercase text-secondary mb-3">Menu</h6>

            <a href="po-dashboard.html">
                <i class="bi bi-grid me-2"></i>Dashboard
            </a>

            <a href="placement-report.html">
                <i class="bi bi-clipboard-data me-2"></i>Placement Report
            </a>

            <a href="department-report.html">
                <i class="bi bi-diagram-3 me-2"></i>Department Report
            </a>

            <a href="student-stats.html">
                <i class="bi bi-bar-chart me-2"></i>Student Statistics
            </a>

            <a href="company-report.html">
                <i class="bi bi-building me-2"></i>Company Report
            </a>

            <a href="student-list.html">
                <i class="bi bi-people me-2"></i>Students
            </a>


            <a href="/TeamC/po-jobs-list.html">
                <i class="bi bi-briefcase me-2"></i>All Jobs
            </a>

            <a href="/TeamD/po-applications.html">
                <i class="bi bi-file-earmark-text me-2"></i>Applications
            </a>
<!--            <a href="/TeamB/po-student-details.html">-->
<!--                <i class="bi bi-person-badge me-2"></i>Student Details-->
<!--            </a>-->

        </div>

        <!-- Main -->
        <div class="col-md-10 p-4">

            <div class="report-title-box">
                <h4 class="fw-semibold mb-0">Student Report</h4>
            </div>

            <!-- Student Info Banner -->
            <div class="glass-card p-4 mb-4">
                <div class="row">
                    <div class="col-md-4"><strong>ID:</strong> <span id="studentId">-</span></div>
                    <div class="col-md-4"><strong>Name:</strong> <span id="studentName">-</span></div>
                    <div class="col-md-4"><strong>Department:</strong> <span id="studentDept">-</span></div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-file-earmark-text fs-2 text-primary"></i>
                        <h6 class="mt-2 text-muted">Total Applications</h6>
                        <h2 class="fw-bold" id="totalApplications">0</h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="glass-card p-4 text-center">
                        <i class="bi bi-star fs-2 text-warning"></i>
                        <h6 class="mt-2 text-muted">Shortlisted</h6>
                        <h2 class="fw-bold" id="shortlistedCount">0</h2>
                    </div>
                </div>
            </div>

            <!-- Application History -->
            <div class="glass-card p-4">
                <h5 class="fw-semibold mb-3">Application History</h5>

                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Company</th>
                        <th>Role</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
    function getStatusClass(status) {
        const s = status.toLowerCase();
        if (s === "selected") return "status-selected";
        if (s === "shortlisted") return "status-shortlisted";
        if (s === "in process") return "status-inprocess";
        if (s === "applied") return "status-applied";
        if (s === "not applied") return "status-notapplied";
        if (s === "not selected") return "status-notselected";
        return "";
    }

    function getStudentIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("id");
    }

    async function loadStudentReport() {
        const studentId = getStudentIdFromUrl();
        if (!studentId) return;

        const token = sessionStorage.getItem("sessionToken");
        if (!token) {
            alert("Session expired. Please login again.");
            window.location.href = "/TeamA/login.html";
            return;
        }

        try {
            // 1. Load student basic info
            const studentRes = await fetch(`http://localhost:8082/api/students/${studentId}`, {
                headers: {
                    "SESSION-TOKEN": token
                }
            });

            if (!studentRes.ok) throw new Error("Failed to load student");

            const student = await studentRes.json();

            document.getElementById("studentId").innerText = student.id ?? "-";
            document.getElementById("studentName").innerText = student.name ?? "Student";
            document.getElementById("studentDept").innerText = student.dept ?? "-";

            // 2. Load report data
            const reportRes = await fetch(`http://localhost:8085/api/reports/student/${studentId}`, {
                headers: {
                    "SESSION-TOKEN": token
                }
            });

            if (!reportRes.ok) throw new Error("Failed to load report");

            const report = await reportRes.json();

            document.getElementById("totalApplications").innerText = report.totalApplications ?? 0;
            document.getElementById("shortlistedCount").innerText = report.shortlisted ?? 0;

            const tbody = document.getElementById("historyTableBody");
            tbody.innerHTML = "";

            (report.history || []).forEach(item => {
                const statusClass = getStatusClass(item.status);

                const row = `
                <tr>
                    <td>${item.companyName}</td>
                    <td>${item.jobTitle}</td>
                    <td class="${statusClass}">${item.status}</td>
                </tr>
                `;
                tbody.innerHTML += row;
            });

        } catch (e) {
            console.error("Failed to load student report:", e);
        }
    }

    loadStudentReport();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
