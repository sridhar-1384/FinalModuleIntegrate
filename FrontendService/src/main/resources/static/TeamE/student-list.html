            <!--            </a>-->

        <!-- Main -->
        <div class="col-md-10 p-4">
            <div class="report-title-box">
                <h4 class="fw-semibold mb-0">Student List</h4>

            <div class="glass-card p-4">

                    </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function getStatusBadge(status) {
        switch (status) {
            case "SELECTED":
            case "PLACED":
                return `<span class="badge bg-success-subtle text-success-emphasis">Selected</span>`;
            case "SHORTLISTED":
            case "IN_PROCESS":
                return `<span class="badge bg-warning-subtle text-warning-emphasis">Shortlisted</span>`;
            case "APPLIED":
                return `<span class="badge bg-primary-subtle text-primary-emphasis">Applied</span>`;
            case "NOT_SELECTED":
                return `<span class="badge bg-danger-subtle text-danger-emphasis">Not Selected</span>`;
            case "NOT_APPLIED":
            default:
                return `<span class="badge bg-secondary-subtle text-secondary-emphasis">Not Applied</span>`;
        }
    }

    function viewReport(id) {
        window.location.href = `student-report.html?id=${id}`;
    }

    async function loadStudents() {
        const tbody = document.getElementById("studentTableBody");
        tbody.innerHTML = "";

        const token = sessionStorage.getItem("sessionToken");
        if (!token) {
            alert("Session expired. Please login again.");
            window.location.href = "/TeamA/login.html";
            return;
        }

        try {
            // 1. Fetch students
            const studentsRes = await fetch("http://localhost:8082/api/students/list", {
                headers: {
                    "X-SESSION-TOKEN": token
                }
            });

            if (!studentsRes.ok) throw new Error("Failed to load students");

            const students = await studentsRes.json();

            for (const s of students) {
                const id = s.id;
                const name = s.name || "Student";

                // 2. Fetch report stats for each student
                const statsRes = await fetch(`http://localhost:8085/api/reports/student/${id}`, {
                    headers: {
                        "X-SESSION-TOKEN": token
                    }
                });

                if (!statsRes.ok) throw new Error("Failed to load stats for student " + id);

                const stats = await statsRes.json();

                const applications = stats.totalApplications || 0;
                const shortlisted = stats.shortlisted || 0;

                let status = "NOT_APPLIED";

                if (stats.history && stats.history.some(h => h.status === "SELECTED")) {
                    status = "SELECTED";
                } else if (shortlisted > 0) {
                    status = "SHORTLISTED";
                } else if (applications > 0) {
                    status = "APPLIED";
                }

                const row = `
                    <tr>
                        <td>${id}</td>
                        <td>${name}</td>
                        <td>${applications}</td>
                        <td>${getStatusBadge(status)}</td>
                        <td>
                            <button class="btn export-btn" onclick="viewReport(${id})">
                                <i class="bi bi-eye me-1"></i> View Report
                            </button>
                        </td>
                    </tr>
                `;

                tbody.innerHTML += row;
            }

        } catch (e) {
            console.error("Failed to load students:", e);
        }
    }

    loadStudents();
</script>

</body>
