<!DOCTYPE html>
<html>
<head>
    <title>Send Notification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h4>Placement System</h4>
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="announcements.html"><i class="bi bi-megaphone"></i> Announcements</a>
    <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
    <a href="send-notification.html" class="active">
        <i class="bi bi-send"></i> Send Notification
    </a>
    <a href="send-email.html"><i class="bi bi-envelope"></i> Send Email</a>
</div>

<div class="main">
    <h3 class="mb-4">Send Notification</h3>

    <div class="content-card">
        <form id="notificationForm">
            <input
                    type="number"
                    id="userId"
                    class="form-control mb-3"
                    placeholder="User ID"
                    required
            >

            <textarea
                    id="message"
                    class="form-control mb-3"
                    placeholder="Message"
                    required
            ></textarea>

            <button type="submit" class="btn btn-primary w-100">
                Send
            </button>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
