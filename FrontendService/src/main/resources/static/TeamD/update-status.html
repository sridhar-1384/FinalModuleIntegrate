<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Update Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8f9fb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body class="p-4">
<div class="glass-card p-5">
    <h4 class="fw-bold mb-4">Update Application Status</h4>

    <div id="loading" class="text-center"><div class="spinner-border text-primary"></div></div>

    <div id="form-content" style="display: none">
        <div class="mb-3">
            <label class="form-label text-muted small">Applicant</label>
            <div class="fw-medium" id="student-name">...</div>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted small">Job Title</label>
            <div class="fw-medium" id="job-title">...</div>
        </div>

        <form id="status-form">
            <div class="mb-4">
                <label for="status-select" class="form-label">New Status</label>
                <select class="form-select" id="status-select" required>
                    <option value="APPLIED">APPLIED</option>
                    <option value="SHORTLISTED">SHORTLISTED</option>
                    <option value="SELECTED">SELECTED</option>
                    <option value="REJECTED">REJECTED</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary" onclick="history.back()">Cancel</button>
                <button type="submit" class="btn btn-primary">Update Status</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8084/api/applications";
    const login_page = "../TeamA/login.html";
    const app_id = new URLSearchParams(window.location.search).get("id");
    const token = sessionStorage.getItem("sessionToken");

    document.addEventListener("DOMContentLoaded", async () => {
        if (!token) {
            alert("Please login first.");
            window.location.href = login_page;
            return;
        }
        if (!app_id) {
            alert("No Application ID provided.");
            history.back();
            return;
        }

        try {
            // 1. Fetch Current Details
            const headers = {
                "Content-Type": "application/json",
                "SESSION-TOKEN": token };
            const response = await fetch(`${API_BASE}/${app_id}`, { method: "GET", headers: headers });

            if (response.status === 401) {
                alert("Session Expired.");
                sessionStorage.clear();
                window.location.href = login_page;
                return;
            }
            if (!response.ok){
                const e = await response.json();
                alert(e.message || "Fetch failed");
                return;
            }


            const app = await response.json();

            document.getElementById("student-name").innerText = app.studentName || "Student #" + app.studentId;
            document.getElementById("job-title").innerText = app.jobTitle || "Job #" + app.jobId;
            document.getElementById("status-select").value = app.status;

            document.getElementById("loading").style.display = "none";
            document.getElementById("form-content").style.display = "block";
        } catch (e) {
            alert("Error loading details: " + e.message);
        }
    });

    //Handle Update Submit
    document.getElementById("status-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const newStatus = document.getElementById("status-select").value;

        try {
            const headers = { "Content-Type": "application/json", "SESSION-TOKEN": token };
            const response = await fetch(`${API_BASE}/${app_id}/status`, {
                method: "PUT",
                headers: headers,
                body: JSON.stringify({ status: newStatus }),
            });

            if (response.status === 403) {
                alert("Access Denied: You cannot update status.");
                return;
            }
            if (!response.ok) {
                const e= await response.json();
                alert(e.message || "Update failed");
                return;
            }

            alert("Status Updated Successfully!");
            history.back();
        } catch (e) {
            alert("Failed to update status.");
        }
    });
</script>
</body>
</html>
