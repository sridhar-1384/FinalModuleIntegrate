<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | My Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="student.css"> </head>

<body>

<nav class="navbar navbar-light app-navbar fixed-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold">
            <i class="fas fa-graduation-cap me-2"></i>Student Portal
        </span>

        <div class="d-flex gap-3 align-items-center">
            <div class="user-info">
                <i class="fas fa-user-circle me-2"></i>
                <span id="navUser" class="text-muted">Loading...</span>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </div>
</nav>

<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-title">Navigation</div>
        <a class="sidebar-link" onclick="goPage('/TeamB/student.html')">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
        <a class="sidebar-link" onclick="goPage('/TeamC/student-browse-jobs.html')">
            <i class="fas fa-briefcase"></i>
            <span>Jobs</span>
        </a>
        <a class="sidebar-link" onclick="goPage('/TeamB/ShowNoti.html')">
            <i class="fas fa-bell"></i>
            <span>Notifications</span>
        </a>
        <a class="sidebar-link active">
            <i class="fas fa-folder-open"></i>
            <span>My Applications</span>
        </a>
    </aside>

    <main class="main-content">
        <div class="page-header mb-4">
            <h3 class="page-title">
                <i class="fas fa-folder-open me-2"></i>My Applications
            </h3>
            <p class="page-subtitle">Track the status of your job applications</p>
        </div>

        <div id="alert-area"></div>

        <div id="applications-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading your applications...</p>
            </div>
        </div>
    </main>
</div>

<script>
    // --- Consistency Logic with Team B ---
    const token = sessionStorage.getItem('sessionToken');

    // Redirect if no token
    if (!token) {
        window.location.href = "/TeamA/login.html";
    }

    const API_BASE = "http://localhost:8084/api/applications";

    // Get Student ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const curr_stu_id = urlParams.get("studentId");

    document.addEventListener("DOMContentLoaded", () => {
        if (curr_stu_id) {
            fetchApplications();
        } else {
            document.getElementById("alert-area").innerHTML =
                `<div class="alert alert-warning">Missing Student ID in URL.</div>`;
        }
    });

    async function fetchApplications() {
        const container = document.getElementById("applications-container");
        const alertArea = document.getElementById("alert-area");

        try {
            const response = await fetch(`${API_BASE}/student/${curr_stu_id}`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Session-Token": token
                },
            });

            if (response.status === 401 || response.status === 403) {
                alert("Session Expired.");
                logout();
                return;
            }

            if (!response.ok) throw new Error("Failed to fetch applications");

            const applications = await response.json();
            container.innerHTML = "";

            // Update Navbar Name if available from first application
            if (applications.length > 0 && applications[0].studentName) {
                document.getElementById("navUser").innerText = applications[0].studentName;
            }

            if (applications.length === 0) {
                container.innerHTML = `
                    <div class="card p-5 text-center shadow-sm">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <h5>No Applications Found</h5>
                        <p class="text-muted">You haven't applied to any jobs yet.</p>
                        <button class="btn btn-primary" onclick="goPage('/TeamC/student-browse-jobs.html')">Browse Jobs</button>
                    </div>`;
                return;
            }

            applications.forEach((app) => {
                const badgeClass = getStatusBadgeClass(app.status);
                const card = `
                    <div class="card p-3 mb-3 shadow-sm border-start border-4 ${badgeClass.border}">
                        <div class="row align-items-center">
                            <div class="col-md-5">
                                <h6 class="mb-1 fw-bold">${app.jobTitle}</h6>
                                <div class="text-muted small"><i class="fas fa-building me-2"></i>${app.companyName}</div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-muted small">Applied On</div>
                                <div>${new Date(app.appliedDate).toLocaleDateString()}</div>
                            </div>
                            <div class="col-md-2">
                                <span class="badge ${badgeClass.bg}">${app.status}</span>
                            </div>
                            <div class="col-md-2 text-end">
                                <a href="application-details.html?id=${app.id}" class="btn btn-outline-primary btn-sm">View Details</a>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += card;
            });
        } catch (error) {
            console.error(error);
            container.innerHTML = `<div class="alert alert-danger">Connection Failed. Ensure Backend is running.</div>`;
        }
    }

    function getStatusBadgeClass(status) {
        switch (status.toUpperCase()) {
            case "SELECTED": return { bg: "bg-success", border: "border-success" };
            case "SHORTLISTED": return { bg: "bg-info", border: "border-info" };
            case "REJECTED": return { bg: "bg-danger", border: "border-danger" };
            case "APPLIED": return { bg: "bg-primary", border: "border-primary" };
            default: return { bg: "bg-secondary", border: "border-secondary" };
        }
    }

    function logout() {
        sessionStorage.removeItem("sessionToken");
        window.location.href = "/TeamA/login.html";
    }

    function goPage(page) {
        // Carry over studentId if moving within student pages
        if (curr_stu_id) {
            window.location.href = `${page}${page.includes('?') ? '&' : '?'}studentId=${curr_stu_id}`;
        } else {
            window.location.href = page;
        }
    }
</script>
</body>
</html>
