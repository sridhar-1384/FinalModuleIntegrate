<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Master Skills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light app-navbar fixed-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">Admin Portal</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-title">Admin Menu</div>

        <a class="sidebar-link" onclick="goPage('showstudents.html')">👥 Students</a>

        <div class="sidebar-divider"></div>

        <a class="sidebar-link" onclick="goPage('showcompanies.html')">🏢 Companies</a>

        <div class="sidebar-divider"></div>

        <a class="sidebar-link active" onclick="goPage('masterskill.html')">🧠 Master Skills</a>

        <div class="sidebar-divider"></div>

        <a class="sidebar-link" onclick="goPage('showreports.html')">📊 Reports</a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Master Skills</h4>

            <button class="btn btn-success btn-sm" onclick="openAddSkillModal()">
                ➕ Add Master Skill
            </button>
        </div>

        <div id="skillsContainer"></div>
        <!-- ADD MASTER SKILL MODAL -->
        <div class="modal fade" id="addSkillModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Add Master Skill</h5>
                        <button type="button" class="btn-close" onclick="closeAddSkillModal()"></button>
                    </div>

                    <div class="modal-body">
                        <input id="skillName"
                               class="form-control mb-2"
                               placeholder="Skill Name" />

                        <input id="skillCategory"
                               class="form-control mb-2"
                               placeholder="Category (Backend / Frontend etc)" />
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary btn-sm" onclick="closeAddSkillModal()">Cancel</button>
                        <button class="btn btn-success btn-sm" onclick="addMasterSkill()">Add</button>
                    </div>

                </div>
            </div>
        </div>

    </main>
</div>

<script src="admin.js"></script>
</body>
</html>
