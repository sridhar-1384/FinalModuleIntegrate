<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Master Skills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4 fixed-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">Admin Portal</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" style="background:#020617;">
        <div class="sidebar-title">Admin Menu</div>

<!--        <a class="sidebar-link"-->
<!--           style="color:#94a3b8;"-->
<!--           onclick="goPage('showstudents.html')">-->
<!--            👥 Students-->
<!--        </a>-->


        <a class="sidebar-link active"
           style="background:#1e293b; color:#e5e7eb; font-weight:600;"
           onclick="goPage('masterskill.html')">
            🧠 Master Skills
        </a>
        <div class="sidebar-divider"></div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"
                style="background:#0f172a; color:white; padding:10px 16px; border-radius:10px;">
                Master Skills
            </h4>

            <button class="btn btn-sm"
                    style="background:#0f172a; color:white;"
                    onclick="openAddSkillModal()">
                ➕ Add Master Skill
            </button>
        </div>

        <div id="skillsContainer"></div>

        <!-- ADD MASTER SKILL MODAL -->
        <div class="modal fade" id="addSkillModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header"
                         style="background:#0f172a; color:white;">
                        <h5 class="modal-title">Add Master Skill</h5>
                        <button type="button" class="btn-close btn-close-white"
                                onclick="closeAddSkillModal()"></button>
                    </div>

                    <div class="modal-body">
                        <input id="skillName" class="form-control mb-2" placeholder="Skill Name" />
                        <input id="skillCategory" class="form-control mb-2"
                               placeholder="Category (Backend / Frontend etc)" />
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary btn-sm" onclick="closeAddSkillModal()">Cancel</button>
                        <button class="btn btn-sm"
                                style="background:#0f172a; color:white;"
                                onclick="addMasterSkill()">Add</button>
                    </div>

                </div>
            </div>
        </div>

    </main>
</div>

<script src="admin.js"></script>
</body>
</html>
