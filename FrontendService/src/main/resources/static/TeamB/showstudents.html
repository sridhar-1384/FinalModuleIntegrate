<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>All Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4 fixed-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">Admin Portal</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" style="background:#020617;">

    <div class="sidebar-title" style="color:#94a3b8;">
        Admin Menu
    </div>

    <!-- ACTIVE: Students -->
    <a class="sidebar-link active"
       style="background:#1e293b; color:#e5e7eb; font-weight:600;"
       onclick="goPage('showstudents.html')">
        👥 Students
    </a>

    <div class="sidebar-divider"></div>

    <!-- NORMAL: Master Skills -->
<!--    <a class="sidebar-link"-->
<!--       style="color:#94a3b8;"-->
<!--       onclick="goPage('masterskill.html')">-->
<!--        🧠 Master Skills-->
<!--    </a>-->

</aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <h4 class="mb-3"
            style="background:#0f172a; color:white; padding:10px 16px; border-radius:10px;">
            All Students
        </h4>

        <div id="studentsContainer"></div>

        <div id="editStudentSection"
             class="card p-3 mt-4"
             style="display:none;">

            <h5 style="background:#0f172a; color:white; padding:8px 12px; border-radius:8px;">
                Update Student
            </h5>

            <div class="mb-2">
                <label>Department</label>
                <input id="adminDept" class="form-control">
            </div>

            <div class="mb-2">
                <label>CGPA</label>
                <input id="adminCgpa" type="number" step="0.01" class="form-control">
            </div>

            <button class="btn"
                    style="background:#0f172a; color:white;"
                    onclick="saveAdminStudent()">Save</button>
            <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
        </div>

    </main>
</div>

<script src="admin.js"></script>
</body>
</html>
