<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="student.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light app-navbar fixed-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">Student Portal</span>

        <div class="d-flex gap-3 align-items-center">
            <span id="navUser" class="text-muted small"></span>
            <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-title">Menu</div>
        <a class="sidebar-link active" onclick="goPage('student.html')">👤 Profile</a>
        <a class="sidebar-link" onclick="goPage('ShowJobs.html')">💼 Jobs</a>
        <a class="sidebar-link" onclick="goPage('ShowNoti.html')">🔔 Notifications</a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <h4 class="mb-4">Dashboard</h4>

        <!-- PROFILE -->
        <div class="card p-3 mb-4" id="section-profile">
            <h5>Profile</h5>
            <p>Name: <span id="name"></span></p>
            <p>Email: <span id="email"></span></p>
            <p>Department: <span id="dept"></span></p>
            <p>CGPA: <span id="cgpa"></span></p>

            <p>
                Resume Status:
                <b id="resumeStatus" class="text-danger">Not Uploaded</b>
            </p>

            <button id="downloadBtn"
                    class="btn btn-outline-primary btn-sm"
                    style="display:none"
                    onclick="downloadResume()">
                ⬇ Download Resume
            </button>
        </div>

        <!-- UPLOAD RESUME -->
        <div class="card p-3 mb-4">
            <h5>Upload Resume</h5>
            <input type="file" id="resumeFile" class="form-control mb-2">
            <button class="btn btn-primary w-100" onclick="uploadResume()">Upload Resume</button>
        </div>

        <!-- SKILLS SECTION -->
        <div id="section-skills">

            <!-- CURRENT SKILLS -->
            <div class="card p-3 mb-4">
                <h5>Current Skills</h5>
                <div id="currentSkills" class="d-flex gap-2 flex-wrap"></div>
            </div>

            <!-- ADD SKILL -->
            <div class="card p-3 mb-4">
                <h5>Add Skill</h5>

                <select id="skillSelect" class="form-control mb-2"></select>

                <select id="levelSelect" class="form-control mb-2">
                    <option value="">Select Level</option>
                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Expert</option>
                </select>

                <button class="btn btn-warning w-100" onclick="addSkill()">Add Skill</button>
            </div>
        </div>


    </main>
</div>

<script src="student.js"></script>
</body>
</html>
