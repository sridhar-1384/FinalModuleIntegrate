<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">Admin Portal</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" style="background:#020617;">
        <div class="sidebar-title">Admin Menu</div>

        <a class="sidebar-link"
           style="color:#94a3b8;"
           onclick="goPage('showstudents.html')">
            👥 Students
        </a>

        <a class="sidebar-link "
           style="background:#1e293b; color:#e5e7eb; font-weight:600;"
           onclick="goPage('masterskill.html')">
            🧠 Master Skills
        </a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- 🔹 BACKGROUND COLOR MATCHED TO SIDEBAR -->
        <h4
                style="
                background:#0f172a;
                color:white;
                padding:12px 18px;
                border-radius:10px;
                display:inline-block;
            ">
            Welcome Admin
        </h4>

        <p class="text-muted mt-3"
           style="
               background:#f8fafc;
               padding:10px 14px;
               border-radius:8px;
               max-width:420px;
           ">
            Use the menu to manage data.
        </p>

    </main>

</div>

<script src="admin.js"></script>
</body>
</html>
